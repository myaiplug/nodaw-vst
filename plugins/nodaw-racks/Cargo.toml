[package]
name = "nodaw-racks"
description = "NoDAW Racks: saturator, 7-band EQ, spatial processor and true-peak limiter in one re-orderable rack, as a CLAP/VST3 plugin"
version = "0.1.0"
edition = "2021"
license = "LicenseRef-NoDAW-Proprietary"
publish = false

[lib]
crate-type = ["staticlib", "rlib"]

[features]
default = ["ui"]
ui = ["dep:apf-webview"]

[dependencies]
apf = { path = "../../vendor/apf/crates/apf" }
apf-webview = { path = "../../vendor/apf/crates/apf-webview", optional = true }
nodaw-dsp = { path = "../../crates/nodaw-dsp" }
nodaw-kit = { path = "../../crates/nodaw-kit" }

[dev-dependencies]
clap-sys = "0.5"
apf-test = { path = "../../vendor/apf/crates/apf-test" }

[package.metadata.apf]
name = "NoDAW Racks"
bundle-id = "com.nodaw.racks"
au-type = "aufx"
au-subtype = "NdRk"
au-manufacturer = "NdDw"
au-manufacturer-name = "NoDAW"
